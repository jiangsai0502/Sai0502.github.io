<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSS Local Bot</title>
  <style>
    :root { color-scheme: dark; --bg:#101419; --panel:#171d24; --line:#2a3340; --text:#e7edf5; --muted:#8fa0b4; --green:#35c46f; --red:#ff5d5d; --blue:#5ca7ff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background:var(--bg); color:var(--text); }
    header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    h1 { font-size:18px; margin:0; }
    main { padding:16px; display:grid; grid-template-columns: 360px 1fr; gap:14px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
    h2 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:0 0 12px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.04); }
    .row:last-child { border-bottom:0; }
    label { color:var(--muted); font-size:12px; }
    input { width:140px; background:#0c1015; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px 7px; }
    input[type="checkbox"] { width:auto; }
    button { background:#0c1015; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:7px 10px; cursor:pointer; }
    button.primary { background:var(--blue); border-color:var(--blue); color:#06111f; font-weight:700; }
    button.danger { color:#fff; background:#9d2828; border-color:#b33131; }
    .ok { color:var(--green); }
    .bad { color:var(--red); }
    .muted { color:var(--muted); }
    pre { white-space:pre-wrap; overflow:auto; margin:0; font-size:12px; }
    .events { max-height:620px; overflow:auto; }
    .event { padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); }
    .event small { color:var(--muted); display:block; margin-bottom:4px; }
    @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>MSS Local Bot</h1>
    <div class="muted" id="clock">...</div>
  </header>
  <main>
    <div>
      <section>
        <h2>状态</h2>
        <div id="status"></div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="primary" id="save">保存设置</button>
          <button id="testAuth">刷新状态</button>
          <button class="danger" id="flatten">全平</button>
        </div>
      </section>
      <section style="margin-top:14px;">
        <h2>设置</h2>
        <div id="settings"></div>
      </section>
    </div>
    <section>
      <h2>最近记录</h2>
      <div class="events" id="events"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
