<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual Breakeven</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div>
      <h1>Manual Breakeven</h1>
      <p>手动开仓后的推保助手</p>
    </div>
    <button id="refresh" title="刷新">↻</button>
  </header>

  <section class="status" id="status"></section>

  <section>
    <h2>当前持仓</h2>
    <div id="positions" class="stack"></div>
  </section>

  <section>
    <h2>推保任务</h2>
    <div id="tasks" class="stack"></div>
  </section>

  <template id="positionTemplate">
    <article class="card position-card">
      <div class="card-head">
        <strong class="symbol"></strong>
        <span class="direction"></span>
      </div>
      <div class="grid">
        <label>手数</label><span class="qty"></span>
        <label>开仓价</label><span class="entry"></span>
        <label>当前价</label><span class="current"></span>
        <label>止损价</label><span class="stop"></span>
        <label>止盈价</label><span class="target"></span>
      </div>
      <div class="control">
        <label>推保触发价</label>
        <input class="trigger" type="number" step="0.1" placeholder="例如 3358.0">
        <button class="start">启动推保</button>
      </div>
    </article>
  </template>

  <script src="sidepanel.js"></script>
</body>
</html>
